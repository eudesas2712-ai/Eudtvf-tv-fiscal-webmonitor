services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: webmonitor
      POSTGRES_PASSWORD: webmonitor
      POSTGRES_DB: webmonitor
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  opensearch:
    image: opensearchproject/opensearch:2.14.0
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - osdata:/usr/share/opensearch/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://webmonitor:webmonitor@postgres:5432/webmonitor
      ADMIN_TOKEN: ${ADMIN_TOKEN:-troque-este-token-admin}
      AUTH_ENFORCEMENT_MODE: ${AUTH_ENFORCEMENT_MODE:-compat}
      SECRET_KEY: ${SECRET_KEY:-troque-esta-chave-secreta-longa}
      REDIS_URL: redis://redis:6379/0
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX: webmonitor-items
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio12345
      MINIO_BUCKET: evidence
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: INFO
    depends_on:
      - postgres
      - redis
      - opensearch
      - minio
    ports:
      - "8000:8000"


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  osdata:
  miniodata: